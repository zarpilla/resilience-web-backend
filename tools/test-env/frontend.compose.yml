# Test Nuxt front end (branch `develop`) for https://w.resilience.earth
name: rw-test-frontend
services:
  re_web_front_test:
    container_name: re_web_front_test
    build:
      context: ${TEST_ROOT:-/var/www/resilience-web/test}/resilience-web-frontend
    restart: unless-stopped
    env_file: ${TEST_ROOT:-/var/www/resilience-web/test}/env/frontend.env
    ports:
      - "127.0.0.1:3004:3000"
