# Test environment — https://w.resilience.earth
#   /                         -> test Nuxt front end (127.0.0.1:3004), basic auth (same htpasswd as before)
#   /api, /admin, /uploads... -> test Strapi (127.0.0.1:1351), no basic auth (Strapi has its own login)
#   everything is marked noindex: search engines must not index the test site
#
# Install (needs sudo), replaces the old w.resilience.earth site (files in /var/www/resilience are kept):
#   sudo cp tools/test-env/nginx-w.resilience.earth.conf /etc/nginx/sites-available/w-resilience-test
#   sudo rm /etc/nginx/sites-enabled/resilience-old
#   sudo ln -s /etc/nginx/sites-available/w-resilience-test /etc/nginx/sites-enabled/w-resilience-test
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name w.resilience.earth;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/w.resilience.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w.resilience.earth/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 300M;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # files uploaded in test, falling back to the production uploads (read only)
    location /uploads/ {
        root /var/www/resilience-web/test/data;
        try_files $uri @prod_uploads;
        expires 7d;
    }
    location @prod_uploads {
        root /var/www/resilience-web/resilience-web-backend/public;
        expires 7d;
    }

    # Strapi: content API, admin panel and its plugin APIs
    location ~ ^/(api|admin|content-manager|content-type-builder|upload|i18n|users-permissions|email|translate|localazy|_health)(/|$) {
        proxy_pass         http://127.0.0.1:1351;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_read_timeout 300s;
    }

    # Nuxt front end, protected
    location / {
        auth_basic           "Restricted Content";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name w.resilience.earth;
    return 301 https://$host$request_uri;
}
