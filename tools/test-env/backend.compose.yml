# Test Strapi (branch `develop`) for https://w.resilience.earth
# Same image as production; code (src/, config/) comes from the test checkout.
# Secrets live in $TEST_ROOT/env/backend.env (generated by setup.sh, never committed).
name: rw-test-backend
services:
  re_web_back_test:
    container_name: re_web_back_test
    image: webcoop/re-web-backend:latest
    restart: unless-stopped
    env_file: ${TEST_ROOT:-/var/www/resilience-web/test}/env/backend.env
    volumes:
      - ${TEST_ROOT:-/var/www/resilience-web/test}/resilience-web-backend/config:/opt/app/config
      - ${TEST_ROOT:-/var/www/resilience-web/test}/resilience-web-backend/src:/opt/app/src
      - ${TEST_ROOT:-/var/www/resilience-web/test}/data/uploads:/opt/app/public/uploads
    ports:
      - "127.0.0.1:1351:1351"
    networks:
      - strapi
networks:
  strapi:
    name: Strapi        # production network: reaches the strapiDB container
    external: true
